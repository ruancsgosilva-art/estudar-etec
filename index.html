["<b>Metáfora</b>: comparação sem 'como' ('Ela é um furacão'). <b>Comparação</b>: com 'como' ('forte como um touro'). <b>Personificação</b>: ação humana em ser não humano. <b>Hipérbole</b>: exagero. <b>Eufemismo</b>: suaviza ('ele nos deixou' = morreu). <b>Antítese</b>: palavras opostas. <b>Metonímia</b>: parte pelo todo ('li Machado de Assis' = li a obra dele).","'Meu quarto é um caos' = metáfora. 'Já falei mil vezes!' = hipérbole."],
["<b>Vírgula</b>: separa itens de uma lista, vocativo, aposto e adjunto adverbial deslocado; nunca separa sujeito de verbo. <b>Acentuação</b>: oxítonas terminadas em a, e, o, em (e plurais) levam acento (café, você, também); paroxítonas são acentuadas em casos como -l, -r, -x, -i(s), -ão(s), -um(ns) (fácil, açúcar, táxi); proparoxítonas são sempre acentuadas (lâmpada, médico).","'Ontem, fomos ao cinema.' (vírgula após adjunto deslocado). 'Lâmpada' é proparoxítona, por isso leva acento."],
["Classes: substantivo (nomeia), adjetivo (qualifica), artigo, numeral, pronome (substitui o substantivo), verbo (ação ou estado), advérbio (modifica verbo, adjetivo ou advérbio), preposição, conjunção e interjeição. <b>Tempos</b>: presente (como), pretérito perfeito (comi), pretérito imperfeito (comia), futuro do presente (comerei) e futuro do pretérito (comeria).","'Ela corre rapidamente': 'corre' é verbo no presente; 'rapidamente' é advérbio, pois modifica o verbo."],
["<b>Sinônimos</b> têm sentido parecido (feliz/contente); <b>antônimos</b>, sentido oposto (alto/baixo). O significado depende do contexto: 'manga' pode ser fruta ou parte da camisa. Cuidado com <b>parônimos</b>, palavras parecidas com sentidos diferentes (acento/assento).","'Ele foi sucinto' = foi breve. Antônimo: prolixo (que fala demais)."],
["<b>Coesão</b> é a ligação entre as partes do texto, feita por conectivos (mas, porque, portanto) e pronomes. <b>Coerência</b> é a lógica das ideias, sem contradição. Conectivos: oposição (mas, porém), causa (porque), conclusão (portanto), concessão (embora).","'Estudou muito, portanto passou.' ('portanto' liga causa e conclusão). 'Estudou muito, mas não passou.' ('mas' indica contraste)."],
["Soma de frações com denominadores diferentes: use o MMC. Multiplicação: numerador × numerador e denominador × denominador. Divisão: multiplique pelo inverso. Decimais: alinhe as vírgulas. Inteiros: sinais iguais na multiplicação dão +; sinais diferentes dão −.","2/3 + 1/4 = 8/12 + 3/12 = 11/12. (−3) × (−4) = 12. 0,5 + 0,25 = 0,75."],
["<b>Direta</b>: as duas grandezas crescem juntas. <b>Inversa</b>: uma cresce e a outra diminui. Monte a tabela, identifique o tipo e resolva. Na direta, multiplique em cruz; na inversa, inverta uma das razões.","3 kg custam R$ 12. Quanto custam 5 kg? (direta) 3/5 = 12/x → 3x = 60 → x = 20. Resposta: R$ 20."],
["<b>Porcentagem</b>: valor = total × taxa ÷ 100. Aumento: multiplique por (1 + taxa); desconto: por (1 − taxa). <b>Juros simples</b>: J = C × i × t, e o montante é M = C + J.","15% de 80 = 80 × 15 ÷ 100 = 12. R$ 500 a 3% ao mês por 4 meses: J = 500 × 0,03 × 4 = R$ 60 e M = R$ 560."],
["<b>Razão</b> é a divisão de duas grandezas (a/b). <b>Proporção</b> é a igualdade de duas razões: a/b = c/d, e vale a·d = b·c. <b>Escala</b> é a razão entre a medida no desenho e a medida real.","2/3 = x/9 → 3x = 18 → x = 6. Escala 1:100 000: 1 cm no mapa = 100 000 cm = 1 km na realidade."],
["Ordem: 1º potências e raízes; 2º multiplicação e divisão (da esquerda para a direita); 3º adição e subtração. Parênteses, colchetes e chaves vêm primeiro. Potências: aᵐ × aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐˣⁿ; a⁰ = 1 (a ≠ 0).","2 + 3 × 4² = 2 + 3 × 16 = 2 + 48 = 50. (−2)² = 4, mas −2² = −4."],
["Isole o x: o que soma passa subtraindo e o que multiplica passa dividindo. Em problemas, defina o que é x, monte a equação, resolva e confira.","2x + 6 = 14 → 2x = 8 → x = 4. 'O dobro de um número mais 5 é 17': 2x + 5 = 17 → x = 6."],
["Forma: ax² + bx + c = 0 (a ≠ 0). <b>Bhaskara</b>: Δ = b² − 4ac e x = (−b ± √Δ) ÷ 2a. Se Δ &gt; 0, há duas raízes reais; se Δ = 0, uma; se Δ &lt; 0, nenhuma real.","x² − 5x + 6 = 0: a = 1, b = −5, c = 6. Δ = 25 − 24 = 1. x = (5 ± 1) ÷ 2, logo x = 3 ou x = 2."],
["São duas incógnitas e duas equações. <b>Adição</b>: some as equações para cancelar uma incógnita. <b>Substituição</b>: isole uma incógnita e substitua na outra equação.","x + y = 10 e x − y = 2. Somando: 2x = 12 → x = 6 e y = 4. Conferência: 6 + 4 = 10 e 6 − 4 = 2."],
["<b>Perímetro</b>: soma dos lados. <b>Área</b>: retângulo = b × h; quadrado = L²; triângulo = b × h ÷ 2; círculo = π × r². <b>Volume</b>: paralelepípedo = comprimento × largura × altura; cubo = a³. Unidades: cm → cm² → cm³; 1 m³ = 1000 litros.","Retângulo 5 × 3: perímetro = 16 e área = 15. Caixa 2 × 3 × 4 cm: volume = 24 cm³. Círculo de r = 3 (π ≈ 3,14): A = 3,14 × 9 = 28,26."],
["Em todo triângulo retângulo: h² = a² + b², em que h é a hipotenusa (lado oposto ao ângulo reto) e a e b são os catetos.","Catetos 5 e 12: h² = 25 + 144 = 169 → h = 13."],
["<b>Média aritmética</b> = soma dos valores ÷ quantidade de valores. <b>Média ponderada</b>: multiplique cada valor pelo peso, some e divida pela soma dos pesos.","Valores 6, 8 e 10: (6 + 8 + 10) ÷ 3 = 8. Notas 4 (peso 1) e 8 (peso 3): (4 + 24) ÷ 4 = 7."],
["Probabilidade = casos favoráveis ÷ casos possíveis (de 0 a 1, ou de 0% a 100%). Na palavra 'ou', some sem contar duas vezes o que se repete; na palavra 'e' (eventos independentes), multiplique.","Dado: sair o número 3 = 1/6. Urna com 3 bolas vermelhas em 10: P = 3/10 = 30%."],
["Antes de calcular, leia o título, os eixos, as unidades e a legenda. Compare os valores com atenção à escala. Variação percentual = (final − inicial) ÷ inicial × 100.","Vendas: janeiro = 20 e fevereiro = 30. Variação = (30 − 20) ÷ 20 × 100 = 50% de aumento."],
["Ecossistema = seres vivos + ambiente. A cadeia alimentar começa no <b>produtor</b> (faz fotossíntese), segue pelos consumidores (primário, secundário...) e termina nos <b>decompositores</b> (fungos e bactérias), que reciclam a matéria. A energia diminui a cada nível.","Grama → gafanhoto → sapo → cobra: o gafanhoto é consumidor primário e o sapo, secundário."],
["<b>Fotossíntese</b> (nos cloroplastos): CO₂ + H₂O + luz → glicose + O₂. <b>Respiração celular</b> (nas mitocôndrias): glicose + O₂ → CO₂ + H₂O + energia (ATP). O produto de uma é a matéria-prima da outra.","A planta absorve CO₂ na fotossíntese e libera O₂; as células usam esse O₂ na respiração."],
["Sistemas: <b>digestório</b> (digere e absorve nutrientes), <b>respiratório</b> (troca de gases nos alvéolos), <b>circulatório</b> (coração e vasos levam o sangue), <b>excretor</b> (rins filtram o sangue), <b>nervoso</b> (comando e sensações) e <b>imunológico</b> (defesa).","O oxigênio entra pelos pulmões e é levado pelo sangue a todas as células do corpo."],
["Células: <b>procariontes</b> (sem núcleo definido, como as bactérias) e <b>eucariontes</b> (com núcleo). O DNA guarda a informação genética. O alelo <b>dominante</b> (A) se manifesta mesmo com um só; o <b>recessivo</b> (a) só aparece em dupla (aa).","Aa × Aa gera 1 AA : 2 Aa : 1 aa. A chance de aa é 1/4 = 25%, e a de manifestar a característica dominante é 3/4 = 75%."],
["As vacinas estimulam o sistema imunológico a produzir defesa (anticorpos e memória) sem causar a doença. Protegem quem se vacina e reduzem a circulação do agente na população. Prevenção também envolve higiene, água tratada, saneamento e vacinação em dia.","Sarampo e poliomielite são doenças que podem ser prevenidas por vacina."],
["<b>Poluição</b>: contaminação do ar, da água ou do solo. O efeito estufa é natural; o <b>aquecimento global</b> se intensifica com o excesso de gases como CO₂ e metano (queima de combustíveis fósseis, desmatamento). <b>Sustentabilidade</b>: usar os recursos sem comprometer as gerações futuras (reduzir, reutilizar, reciclar, usar energias renováveis).","Trocar o carro por transporte coletivo ou bicicleta reduz a emissão de CO₂."],
["v = d ÷ t. Converta as unidades antes de calcular: km/h ÷ 3,6 = m/s e m/s × 3,6 = km/h.","150 km em 2 h: v = 150 ÷ 2 = 75 km/h. E 72 km/h ÷ 3,6 = 20 m/s."],
["<b>1ª lei de Newton</b> (inércia): sem força resultante, o corpo mantém o repouso ou o movimento retilíneo uniforme. <b>2ª lei</b>: F = m × a. <b>3ª lei</b>: toda ação tem uma reação de mesma intensidade e sentido contrário, aplicada em corpos diferentes. A força é medida em newtons (N).","m = 2 kg e a = 3 m/s²: F = 2 × 3 = 6 N."],
["A energia não se cria nem se destrói: ela se <b>transforma</b> (conservação da energia). Formas: cinética (movimento), potencial gravitacional (altura), elétrica, térmica e química.","Lâmpada: energia elétrica → luz + calor. Usina hidrelétrica: potencial da água → cinética → elétrica."],
["<b>Temperatura</b> mede o grau de agitação das partículas. <b>Calor</b> é energia térmica em trânsito do corpo mais quente para o mais frio. Propagação: condução (contato), convecção (fluidos) e irradiação (ondas, como a luz do Sol). Kelvin = °C + 273.","25 °C = 25 + 273 = 298 K. Uma panela de metal esquenta no cabo por condução."],
["Potência (W) = energia ÷ tempo. Energia consumida: E = P × t, em kWh (potência em kW × tempo em horas). Custo = kWh × tarifa.","Chuveiro de 5 000 W (5 kW) usado 1 h por dia, 30 dias: E = 5 × 1 × 30 = 150 kWh. Com tarifa de exemplo de R$ 0,80/kWh, custa R$ 120."],
["O átomo tem <b>núcleo</b> (prótons, positivos, e nêutrons, sem carga) e <b>eletrosfera</b> (elétrons, negativos). O <b>número atômico</b> (Z) é o número de prótons e identifica o elemento. Símbolos: Na (sódio), K (potássio), Fe (ferro), O (oxigênio).","Todo átomo com 8 prótons é de oxigênio (Z = 8)."],
["<b>Substância pura</b>: composição fixa; simples (um só elemento, como O₂) ou composta (como H₂O). <b>Mistura</b>: duas ou mais substâncias; <b>homogênea</b> (uma fase, como água com sal) ou <b>heterogênea</b> (mais de uma fase, como água e óleo).","Água com sal dissolvido: mistura homogênea. Água e óleo: heterogênea."],
["<b>Filtração</b>: separa sólido de líquido. <b>Decantação</b>: líquidos que não se misturam ou sólido que se deposita. <b>Destilação</b>: líquidos com pontos de ebulição diferentes ou sal da água. <b>Evaporação</b>, <b>peneiração</b>, <b>catação</b> e <b>separação magnética</b> (ímã separa ferro).","Água e areia: filtração ou decantação. Água e sal: destilação ou evaporação."],
["<b>Transformação física</b>: não forma nova substância (mudança de estado, rasgar papel). <b>Transformação química</b>: forma novas substâncias (queimar, enferrujar, cozinhar um ovo). Sinais: mudança de cor, liberação de gás, luz ou calor.","Gelo derretendo = física. Ferro enferrujando = química."],
["<b>Sólido</b>: forma e volume definidos. <b>Líquido</b>: volume definido e forma do recipiente. <b>Gasoso</b>: sem forma nem volume definidos. Mudanças: fusão (sólido → líquido), solidificação, vaporização (líquido → gás), condensação e sublimação (sólido ↔ gás direto). Água: funde a 0 °C e ferve a 100 °C ao nível do mar.","Gelo a 0 °C vira água líquida: fusão. Gelo-seco virando gás sem passar pelo líquido: sublimação."],
["De 1500 (chegada dos portugueses) a 1822. Economia: pau-brasil, açúcar (engenhos, no Nordeste) e ouro (século XVIII, em Minas Gerais). A base do trabalho foi a escravidão de africanos e indígenas. As capitanias hereditárias e o governo-geral (1549) organizaram a colônia.","Engenho de açúcar: grande propriedade monocultora, com mão de obra escravizada, que produzia para exportar."],
["Em 1808, a família real portuguesa fugiu de Napoleão e veio para o Brasil. Em 1821, D. João VI voltou a Portugal e as Cortes portuguesas quiseram recolonizar o Brasil. Em 7 de setembro de 1822, D. Pedro declarou a Independência.","Sequência: 1808 (chegada da corte) → 1821 (volta de D. João VI) → 1822 (Independência)."],
["<b>Primeiro Reinado</b> (1822–1831, D. Pedro I): Constituição de 1824; terminou com a abdicação. <b>Período Regencial</b> (1831–1840). <b>Segundo Reinado</b> (1840–1889, D. Pedro II): expansão do café, Guerra do Paraguai, Lei do Ventre Livre (1871), Lei dos Sexagenários (1885) e Lei Áurea (1888).","Lei Áurea (1888) = abolição da escravidão; no ano seguinte, a República (1889)."],
["<b>República Velha</b> (1889–1930): política do café com leite (SP e MG) e voto de cabresto. <b>Era Vargas</b> (1930–1945): Revolução de 1930, voto feminino (1932), Estado Novo (1937–1945) e CLT (1943).","Getúlio Vargas assumiu em 1930 e o Estado Novo veio em 1937."],
["Golpe em 31 de março/1º de abril de 1964, que depôs o presidente João Goulart; a ditadura durou até 1985. O AI-5 (1968) endureceu a repressão, com censura e perseguição política. Redemocratização: Diretas Já (1984), eleição de Tancredo Neves (1985) e Constituição de 1988.","Ditadura militar: 1964–1985. Constituição atual: 1988."],
["<b>Revolução Industrial</b>: começou na Inglaterra no século XVIII, com a máquina a vapor e as fábricas. <b>1ª Guerra Mundial</b>: 1914–1918. <b>2ª Guerra Mundial</b>: 1939–1945 (Eixo × Aliados), terminando com a rendição da Alemanha (maio) e do Japão (setembro de 1945).","1ª Guerra: 1914–1918. 2ª Guerra: 1939–1945."],
["<b>Antiguidade</b>: Mesopotâmia (escrita cuneiforme), Egito (faraós e o rio Nilo), Grécia (democracia em Atenas) e Roma (república e império). <b>Idade Média</b>: da queda do Império Romano do Ocidente (476) à queda de Constantinopla (1453), com feudalismo e grande poder da Igreja.","Queda de Roma do Ocidente em 476: marco do início da Idade Média."],
["O IBGE divide o Brasil em 5 regiões: <b>Norte</b> (Amazônia; a maior em área), <b>Nordeste</b> (9 estados; Caatinga e litoral), <b>Centro-Oeste</b> (agronegócio; Brasília), <b>Sudeste</b> (a mais populosa e industrializada: SP, MG, RJ e ES) e <b>Sul</b> (PR, SC e RS; clima subtropical).","O Paraná pertence ao Sul, e não ao Sudeste."],
["Biomas: <b>Amazônia</b> (floresta tropical; o maior), <b>Cerrado</b> (savana), <b>Mata Atlântica</b> (a mais devastada), <b>Caatinga</b> (semiárida e exclusivamente brasileira), <b>Pampa</b> (campos do Sul) e <b>Pantanal</b> (planície alagável). Climas principais: equatorial, tropical, semiárido e subtropical.","Vegetação de campos no Rio Grande do Sul: Pampa. Clima semiárido no sertão nordestino: Caatinga."],
["<b>Globalização</b>: integração mundial de economia, comunicação e cultura, impulsionada por transportes e internet. Traz comércio e empresas multinacionais, mas também desigualdades. Setores: <b>primário</b> (agropecuária e extração), <b>secundário</b> (indústria) e <b>terciário</b> (comércio e serviços).","Padaria = terciário; fábrica de roupas = secundário; plantação de soja = primário."],
["<b>Urbanização</b>: crescimento da população urbana. No Brasil, acelerou-se a partir da década de 1950, com a industrialização, e hoje a grande maioria mora em cidades. <b>Êxodo rural</b>: migração do campo para a cidade. Problemas urbanos: moradia, trânsito e saneamento.","Muitos nordestinos migraram para o Sudeste em busca de emprego na indústria."],
["O Censo 2022 (IBGE) contou 203.062.512 habitantes, cerca de 203,1 milhões. O Sudeste é a região mais populosa (cerca de 41,8% do total) e o Centro-Oeste, a menos populosa (cerca de 8%). De 2010 a 2022 o crescimento foi de 0,52% ao ano, o menor já registrado: a população cresce cada vez mais devagar.","São Paulo é o estado mais populoso, com cerca de 44,4 milhões de habitantes."],
["<b>Agropecuária</b>: soja, milho, cana-de-açúcar, café e pecuária; o agronegócio é forte no Centro-Oeste. A <b>indústria</b> é mais concentrada no Sudeste. <b>Energia</b>: renovável (hidrelétrica, eólica, solar, biomassa) e não renovável (petróleo, carvão e gás natural). No Brasil, a hidrelétrica é a principal fonte de eletricidade.","Cana-de-açúcar gera açúcar e etanol (biocombustível, de fonte renovável)."],
["<b>Escala</b> = distância no mapa ÷ distância real. <b>Latitude</b>: distância ao Equador (0°), para norte ou sul, até 90°. <b>Longitude</b>: distância ao Meridiano de Greenwich (0°), para leste ou oeste, até 180°.","Escala 1:50 000: 1 cm no mapa = 50 000 cm = 500 m. São Paulo fica a cerca de 23° de latitude sul."],
["Desmatamento, queimadas, poluição de rios e mares, lixo, perda de biodiversidade e mudanças climáticas. Soluções: reflorestamento, fiscalização, energias limpas, coleta seletiva e consumo consciente.","Queimadas liberam CO₂ na atmosfera e destroem o habitat de muitas espécies."]
];
const LI=(si,gi,ti)=>{let n=0;for(let a=0;a<si;a++)GD[a][2].forEach(g=>n+=g[1].length);for(let b=0;b<gi;b++)n+=GD[si][2][b][1].length;return n+ti};
function lic(si,gi,ti){DB.gd=DB.gd||{};const n=LI(si,gi,ti),g=GD[si][2][gi],t=LC[n],k=gk(si,gi,ti),fl=[];GD.forEach((d,a)=>d[2].forEach((h,b)=>h[1].forEach((_,c)=>fl.push([a,b,c]))));const pv=fl[n-1],nx=fl[n+1];
app.innerHTML=hdr()+`<div class="card"><p class="m">${GD[si][0]}${g[0]?" · "+g[0]:""}</p><h2>${g[1][ti]}</h2><p>${t[0]}</p><div class="fx"><b>Exemplo:</b> ${t[1]}</div><p class="m">Resumo para estudo. Confira também sua apostila e o edital oficial da ETEC.</p><div class="row"><button class="b" onclick="mkd(${si},${gi},${ti},this)">${DB.gd[k]?"✓ Estudado":"Marcar como estudado"}</button><button class="b2" onclick="trSub(${si})">Treinar ${GD[si][0]}</button></div><div class="row">${pv?`<button class="b2" onclick="lic(${pv})">← Anterior</button>`:""}${nx?`<button class="b2" onclick="lic(${nx})">Próximo →</button>`:""}<button class="b2" onclick="guia()">Voltar ao guia</button></div></div>`;scrollTo(0,0)}
function mkd(si,gi,ti,b){const k=gk(si,gi,ti);DB.gd[k]?delete DB.gd[k]:DB.gd[k]=1;save();b.textContent=DB.gd[k]?"✓ Estudado":"Marcar como estudado"}
const lvn=t=>t.lv=="f"?"Fácil":t.lv=="m"?"Médio":t.m=="sim"?"Simulado ETEC":"Treino";

function lvs(l){const a=DB.att.filter(t=>lvk(t)==l),p=a.map(t=>score(t).c*100/t.ids.length),q=a.filter(t=>t.ids.length>=5).map(t=>score(t).c*100/t.ids.length);return{n:a.length,best:q.length?Math.round(Math.max(...q)):null,last:p.length?Math.round(p[p.length-1]):null}}
const pool=l=>Q.map((_,i)=>i).filter(i=>l=="f"?DF[i]=="1":DF[i]!="1");
const hnt=i=>{const p=FX[i].split("|");return `<div class="fx"><b>💡 Dicas do modo Fácil</b>${p[0]=="F"?`<p>Fórmula (${p[1]}): <b>${p[2]}</b><br>Variáveis: ${p[3]}</p>`:""}<p>${p[p[0]=="E"?2:6]}</p></div>`};
function startLv(l){const pl=pool(l),n=Math.min(10,pl.length);trIds(pick(n,pl),`Modo ${l=="f"?"Fácil":"Médio"}: ${n} de ${pl.length} questões do nível.${l=="f"?" As dicas e fórmulas aparecem antes de você responder.":" Sem dicas durante a resolução."}`,l)}
function rvw(r,t){const w=Object.entries(r.by).filter(([k,v])=>v[0]*100/v[2]<70).map(([k])=>k),p=Math.round(r.c*100/t.ids.length),c=CF();let s=`<p><b>Matérias para revisar:</b> ${w.length?w.join(", "):"nenhuma, com 70% ou mais em todas"}</p>`;
if(t.lv=="f"&&p>=c.tm&&t.ids.length>=5)s+=`<div class="fx">🎉 ${p}% no modo Fácil! Sugestão: tente o modo Médio. <button class="b" onclick="startLv('m')">Começar Médio</button></div>`;
if(t.lv=="m"&&p>=c.te&&t.ids.length>=5)s+=`<div class="fx">🎉 ${p}% no modo Médio! Sugestão: faça o simulado ETEC. <button class="b" onclick="cfgSim()">Ir para o simulado</button></div>`;return s}
function lvtab(){const T={};DB.att.forEach(t=>{const l=lvk(t);if(l=="t")return;t.ids.forEach(i=>{const k=t.a[i];if(k==null)return;const s=sub(i),x=((T[s]=T[s]||{})[l]=T[s][l]||[0,0]);x[1]++;if(k==Q[i][3])x[0]++})});
const c=x=>x?Math.round(x[0]*100/x[1])+"% ("+x[0]+"/"+x[1]+")":"—";return `<div style="overflow-x:auto"><table class="tb"><tr><th>Matéria</th><th>Fácil</th><th>Médio</th><th>ETEC</th></tr>`+SUBS.map(s=>`<tr><td>${s}</td><td>${c((T[s]||{}).f)}</td><td>${c((T[s]||{}).m)}</td><td>${c((T[s]||{}).e)}</td></tr>`).join("")+`</table></div>`}
function svc(a,b){DB.cfg={tm:cl(a),te:cl(b)};save();modos()}
function modos(){const c=CF(),f=lvs("f"),m=lvs("m"),e=lvs("e"),sf=f.best!=null&&f.best>=c.tm,sm=m.best!=null&&m.best>=c.te;
const cd=(st,nm,ds,s,tag,btn)=>`<section class="card"><h3>${nm} <span class="pr">${st}</span></h3><p>${ds}</p><p class="m">${s.n?`${s.n} tentativa(s) · melhor ${s.best==null?"—":s.best+"%"} · última ${s.last}%`:"Ainda sem tentativas"}</p><div class="bar"><i style="width:${s.best||0}%"></i></div><p><b>${tag}</b></p>${btn}</section>`;
app.innerHTML=hdr()+`<div class="card"><h2>🎯 Modos de estudo</h2><p class="m">Os níveis são sugestões: você pode entrar em qualquer modo a qualquer momento.</p><button class="b2" onclick="home()">← Voltar ao início</button></div>`+
cd("★☆☆ Fácil","Modo Fácil — Aprendizado",`Questões básicas (${pool("f").length} no banco). Dicas e fórmulas antes de responder e explicação passo a passo depois.`,f,"Disponível desde o início",`<button class="b" onclick="startLv('f')">Começar Fácil</button>`)+
cd("★★☆ Médio","Modo Médio — Desafio",`Questões mais difíceis (${pool("m").length} no banco), sem dicas durante a resolução e com explicação completa depois.`,m,sf?`✅ Sugerido: você atingiu ${f.best}% no Fácil (meta: ${c.tm}%)`:`Sugerido após ${c.tm}% no Fácil (acesso livre)`,`<button class="b" onclick="startLv('m')">Começar Médio</button>`)+
cd("★★★ ETEC","Modo ETEC — Simulação do vestibulinho",`Prova de ${Q.length} questões com 5 alternativas, cronômetro, painel de navegação e gabarito só no final.`,e,sm?`✅ Sugerido: você atingiu ${m.best}% no Médio (meta: ${c.te}%)`:`Sugerido após ${c.te}% no Médio (acesso livre)`,`<button class="b" onclick="cfgSim()">Ir para a simulação</button>`)+
`<div class="card"><h3>Desempenho por matéria e nível</h3>${lvtab()}</div><div class="card"><h3>Requisitos de progressão</h3><div class="fm"><label>% no Fácil para sugerir o Médio<input id="ct" type="number" min="1" max="100" value="${c.tm}"></label><label>% no Médio para sugerir o ETEC<input id="ce" type="number" min="1" max="100" value="${c.te}"></label></div><div class="row"><button class="b2" onclick="svc(+$('ct'),+$('ce'))">Salvar requisitos</button></div></div>`}
function demo(){const p=DEMO.split("|");app.innerHTML=hdr()+`<div class="card"><h2>Exemplo de correção</h2><p class="m">Exemplo ilustrativo, que não faz parte do banco de questões.</p><h4>Um produto custa R$ 200 e recebeu um desconto de 15%. Qual é o preço final?</h4>${panel(DEMO,0,true)}<p><b>🪤 Pegadinha:</b> confundir o valor do desconto com o preço final. Os R$ 30 são o desconto, não o que será pago.</p><p>💡 <b>Dica para questões parecidas:</b> ${p[6]}</p><div class="row"><button class="b2" onclick="home()">← Voltar ao início</button></div></div>`}
const cm=(i,k,n,t)=>{const q=Q[i],o=opts(i),st=k==null?["➖","Em branco","bl"]:k==q[3]?["✅","Correta","okc"]:["❌","Incorreta","noc"];return `<div class="card ${st[2]}"><p class="m">${n?n+". ":""}${sub(i)} · ${AS[i]} · ${LV[DF[i]]}</p><b>${st[0]} ${st[1]}</b><h4>${q[1]}</h4><p>Sua resposta: ${k==null?"—":lt(t,i,k)+") "+o[k]}<br>Resposta correta: ${lt(t,i,q[3])}) ${o[q[3]]}</p><p><b>Explicação:</b> ${q[4]}</p>${fxA(i)}<p><b>🪤 Onde está a pegadinha:</b> ${q[5]}</p>${fxT(i)}</div>`};
let SG=[];
function home(){clearInterval(TM);S=null;const st=stats(),n=DB.att.length,last=DB.att[n-1];let lw=-1;for(let x=n-1;x>=0;x--)if(score(DB.att[x]).w){lw=x;break}
let h=hdr()+(MIG?`<div class="card" role="alert">⚠ ${MIG}</div>`:"")+`<section class="card hero"><h1>Prepare-se para o vestibulinho da ETEC</h1><p class="m">Simulados de 50 questões, correção comentada e plano de estudos baseado nos seus resultados.</p><div class="row"><button class="b" onclick="modos()">🎯 Modos de estudo</button><button class="b2" onclick="cfgSim()">▶ Começar simulado</button><button class="b2" onclick="cfgTr()">📚 Treinar por matéria</button><button class="b2" onclick="demo()">📐 Exemplo de correção</button><button class="b2" onclick="guia()">📖 Guia de estudos</button>${DB.ses?`<button class="b2" onclick="sim()">⏱ Continuar prova</button>`:""}${lw>=0?`<button class="b2" onclick="rev(${lw})">🔁 Revisar erros</button>`:""}</div></section>`;
if(!n){app.innerHTML=h+`<div class="card"><h3>Seu painel está vazio</h3><p class="m">Faça seu primeiro simulado ou treino. Aproveitamento, histórico e sugestões de estudo aparecerão aqui.</p></div>`;return}
const r=score(last);h+=`<div class="g4"><div class="st">Respondidas<b>${st.n}</b></div><div class="st">Acertos<b>✓ ${st.c}</b></div><div class="st">Erros<b>✗ ${st.w}</b></div><div class="st">Aproveitamento<b>${st.n?Math.round(st.c*100/st.n):0}%</b></div><div class="st">Última nota<b>${r.c}/${last.ids.length}</b></div></div>`;
h+=`<div class="card"><h3>Matérias com mais dificuldade</h3>`+Object.entries(st.sub).sort((a,b)=>b[1][1]/(b[1][0]+b[1][1])-a[1][1]/(a[1][0]+a[1][1])).map(([k,v])=>`<div class="rw"><span>${k}</span><div class="bar"><i style="width:${v[0]*100/(v[0]+v[1])}%"></i></div><b>${Math.round(v[1]*100/(v[0]+v[1]))}% de erro</b></div>`).join("")+`</div>`;
SG=Object.entries(st.as).sort((a,b)=>b[1].length-a[1].length).slice(0,3);
h+=`<div class="card"><h3>Sugestões de estudo</h3>${n<2?`<p class="m">Sugestões preliminares: ainda há poucos dados.</p>`:""}`+(SG.length?SG.map(([a,l],j)=>`<div class="hs"><span><b>${a}</b><br><span class="m">Motivo: ${l.length} questão(ões) errada(s) neste assunto</span></span><button class="b2" onclick="trAs(${j})">Treinar ${a}</button></div>`).join(""):`<p class="m">Nenhum erro registrado até agora. Continue praticando!</p>`)+`</div>`;
h+=`<div class="card"><h3>Histórico de tentativas</h3>`+DB.att.map((t,x)=>[t,x]).slice(-10).reverse().map(([t,x])=>{const s=score(t);return `<div class="hs"><span>${new Date(t.t).toLocaleDateString("pt-BR")} · ${lvn(t)} · <b>${s.c}/${t.ids.length}</b> · ${fmt(t.d)}</span><span><button class="b2" onclick="res(${x})">Resultado</button> ${s.w?`<button class="b2" onclick="rev(${x})">Erros</button>`:""}</span></div>`}).join("")+`</div>`;
app.innerHTML=h}
function trAs(j){const a=SG[j][0];trIds(Q.map((_,i)=>i).filter(i=>AS[i]==a),`Treino de ${a}: ${Q.filter((_,i)=>AS[i]==a).length} questão(ões) disponível(is) neste assunto.`)}
function cfgSim(){app.innerHTML=hdr()+`<div class="card"><h2>Simulado oficial</h2><p class="m">50 questões, sem gabarito durante a prova. Você pode navegar, marcar questões e alterar respostas até entregar. O tempo continua correndo mesmo se você sair ou atualizar a página.</p><p class="m">${Q.length<=50?"O banco tem "+Q.length+" questões: cada tentativa embaralha a ordem das questões e das alternativas, mas as questões são as mesmas. Adicione mais questões ao banco para ter provas diferentes.":"Cada tentativa sorteia 50 questões, priorizando as menos usadas."}</p><div class="fm"><label>Duração<select id="du">${[30,60,90,120,180,240].map(m=>`<option value="${m}" ${m==DB.dur?"selected":""}>${m} minutos</option>`).join("")}</select></label></div><div class="row"><button class="b" onclick="startSim()">Iniciar prova</button><button class="b2" onclick="home()">Voltar</button></div></div>`}
function startSim(){const m=+$("du"),go=()=>{DB.dur=m;const ids=pick(50);DB.ses={id:uid(),ids,pm:mkpm(ids),a:{},mk:{},cur:0,s:Date.now(),end:Date.now()+m*60000};save();sim()};DB.ses?ask("Já existe uma prova em andamento. Descartar e começar uma nova?",go,"Descartar e começar"):go()}
function sim(){const s=DB.ses;if(!s)return home();if(!s.pm){s.pm=mkpm(s.ids);save()}if(Date.now()>=s.end)return fin(true);clearInterval(TM);TM=setInterval(tick,1000);drawSim()}
function tick(){const s=DB.ses;if(!s){clearInterval(TM);return}const r=Math.ceil((s.end-Date.now())/1000);if(r<=0){clearInterval(TM);return fin(true)}const e=document.getElementById("tm");if(e){e.textContent=(r<300?"⚠ ":"⏱ ")+fmt(r);e.classList.toggle("warn",r<300)}}
function drawSim(){const s=DB.ses,i=s.ids[s.cur],q=Q[i],ans=Object.keys(s.a).length,r=Math.max(0,Math.ceil((s.end-Date.now())/1000));
app.innerHTML=hdr()+`<div class="bar2"><div class="tm${r<300?" warn":""}" id="tm" role="timer" aria-label="Tempo restante">${r<300?"⚠":"⏱"} ${fmt(r)}</div><span class="m">${ans}/${s.ids.length} respondidas</span><button class="b2" onclick="exitSim()">Sair</button></div><div class="bar"><i style="width:${ans*100/s.ids.length}%"></i></div><div class="card"><p class="m">Questão ${s.cur+1} de ${s.ids.length} · ${sub(i)}</p><h2>${q[1]}</h2>`+dtxt(i,s.pm[i]).map((t,k)=>`<button class="o${s.a[i]===s.pm[i][k]?" sel":""}" aria-pressed="${s.a[i]===s.pm[i][k]}" onclick="ans(${k})"><b>${L[k]})</b> ${t}</button>`).join("")+`<div class="row"><button class="b2" onclick="go(-1)" ${s.cur?"":"disabled"}>← Anterior</button><button class="b2" onclick="go(1)" ${s.cur<s.ids.length-1?"":"disabled"}>Próxima →</button><button class="b2" onclick="mark()" aria-pressed="${!!s.mk[i]}">${s.mk[i]?"🚩 Marcada para revisar":"🏳 Marcar para revisar"}</button>${s.a[i]!=null?`<button class="b2" onclick="clr()">Limpar resposta</button>`:""}</div></div><div class="card"><p class="m">Painel de questões</p><div class="pn">`+s.ids.map((id,j)=>`<button class="${s.a[id]!=null?"an":""}${s.mk[id]?" mk":""}${j==s.cur?" cu":""}" aria-label="Questão ${j+1}, ${s.a[id]!=null?"respondida":"em branco"}${s.mk[id]?", marcada para revisão":""}" onclick="jump(${j})">${j+1}${s.mk[id]?"⚑":""}</button>`).join("")+`</div><p class="m">Verde = respondida · cinza = em branco · ⚑ = marcada · contorno branco = atual</p><button class="b" onclick="ask2()">Finalizar prova</button></div>`}
function ans(k){const s=DB.ses,i=s.ids[s.cur];s.a[i]=s.pm[i][k];save();drawSim();document.querySelectorAll(".o")[k].focus()}
function clr(){const s=DB.ses;delete s.a[s.ids[s.cur]];save();drawSim()}
function mark(){const s=DB.ses,i=s.ids[s.cur];s.mk[i]?delete s.mk[i]:s.mk[i]=1;save();drawSim()}
function go(d){DB.ses.cur+=d;save();drawSim();scrollTo(0,0)}
function jump(j){DB.ses.cur=j;save();drawSim();scrollTo(0,0)}
function exitSim(){ask("Sair da prova? Suas respostas ficam salvas, mas o tempo continua correndo.",home,"Sair")}
function ask2(){const s=DB.ses,b=s.ids.length-Object.keys(s.a).length,m=Object.keys(s.mk).length;ask(`${b?`Você deixou ${b} questão(ões) em branco. `:""}${m?`Há ${m} marcada(s) para revisão. `:""}Finalizar a prova e ver o resultado?`,()=>fin(false),"Finalizar")}
function fin(auto){clearInterval(TM);const s=DB.ses;if(!s)return home();DB.att.push({id:s.id,pm:s.pm,t:s.s,m:"sim",lv:"e",d:Math.round((Math.min(Date.now(),s.end)-s.s)/1000),ids:s.ids,a:s.a});DB.ses=null;save();res(DB.att.length-1,auto)}
function res(x,auto){clearInterval(TM);const t=DB.att[x],r=score(t),tot=t.ids.length;
app.innerHTML=hdr()+(auto?`<div class="card">⏰ Tempo esgotado: a prova foi entregue automaticamente.</div>`:"")+`<div class="card"><h2>Resultado · ${lvn(t)}</h2><div class="big">${r.c}<small>/${tot}</small></div><p>${Math.round(r.c*100/tot)}% de acertos · ✓ ${r.c} corretas · ✗ ${r.w} incorretas · ➖ ${r.b} em branco · ⏱ ${fmt(t.d)}</p><p class="m">Nota deste simulado, sem relação com a nota oficial de classificação da ETEC.</p><h3>Desempenho por matéria</h3>`+Object.entries(r.by).map(([k,v])=>`<div class="rw"><span>${k}</span><div class="bar"><i style="width:${v[0]*100/v[2]}%"></i></div><b>${v[0]}/${v[2]}</b></div>`).join("")+rvw(r,t)+`<div class="row"><button class="b" onclick="rev(${x})" ${r.w?"":"disabled"}>🔁 Revisar meus erros</button><button class="b2" onclick="${t.m=="sim"?"cfgSim()":t.lv?"startLv('"+t.lv+"')":"cfgTr()"}">↻ Refazer</button><button class="b2" onclick="home()">Voltar ao início</button></div></div><h3>Gabarito comentado</h3>`+t.ids.map((i,j)=>cm(i,t.a[i],j+1,t)).join("");scrollTo(0,0)}
function cfgTr(){app.innerHTML=hdr()+`<div class="card"><h2>Treinar por matéria</h2><div class="fm"><label>Matéria<select id="cs"><option value="">Todas</option>${SUBS.map(s=>`<option>${s}</option>`).join("")}</select></label><label>Quantidade<input id="cq" type="number" min="1" max="50" value="10"></label><label>Dificuldade<select id="cd"><option value="">Todas</option><option value="1">Fácil</option><option value="2">Médio</option><option value="3">Difícil</option></select></label><label>Questões<select id="cf"><option value="">Todas</option><option value="n">Inéditas (nunca respondidas)</option><option value="e">Anteriormente erradas</option></select></label><label>Ordem<select id="co"><option value="r">Aleatória</option><option value="s">Sequencial</option></select></label></div><p class="m" id="ms" role="alert"></p><div class="row"><button class="b" onclick="startTr()">Iniciar treino</button><button class="b2" onclick="home()">Voltar</button></div></div>`}
function startTr(){const seen=new Set();DB.att.forEach(t=>t.ids.forEach(i=>{if(t.a[i]!=null)seen.add(i)}));
const wr=i=>{for(let x=DB.att.length-1;x>=0;x--){const k=DB.att[x].a[i];if(k!=null)return k!=Q[i][3]}return false};
let p=Q.map((_,i)=>i).filter(i=>(!$("cs")||sub(i)==$("cs"))&&(!$("cd")||DF[i]==$("cd"))&&($("cf")!="n"||!seen.has(i))&&($("cf")!="e"||wr(i)));
if(!p.length)return document.getElementById("ms").textContent="Não há questões com esses filtros. Tente outros.";
const q=Math.max(1,+$("cq")||10);if($("co")=="r")p=shuf(p);trIds(p.slice(0,q),p.length<q?`Só existem ${p.length} questão(ões) com esses filtros.`:"")}
function trIds(ids,note,lv){clearInterval(TM);S={ids,lv,pm:mkpm(ids),cur:0,a:{},t0:Date.now(),note:note||"",sel:null,done:false};drawTr()}
function drawTr(){const i=S.ids[S.cur],pm=S.pm[i],q=Q[i].slice(),d=S.done,k=S.sel,last=S.cur==S.ids.length-1;q[3]=pm.indexOf(Q[i][3]);const opts=()=>dtxt(i,pm);
app.innerHTML=hdr()+`<div class="bar2"><span class="m">${S.lv=="f"?"Fácil":S.lv=="m"?"Médio":"Treino"} · questão ${S.cur+1} de ${S.ids.length} · ${sub(i)}</span><button class="b2" onclick="ask('Encerrar o treino? As questões já respondidas serão salvas.',endTr,'Encerrar')">Encerrar treino</button></div><div class="bar"><i style="width:${S.cur*100/S.ids.length}%"></i></div>${S.note&&!S.cur?`<p class="m">${S.note}</p>`:""}<div class="card"><h2>${q[1]}</h2>${S.lv=="f"&&!d?hnt(i):""}`+opts(i).map((t,j)=>`<button class="o${d?(j==q[3]?" ok":j==k?" no":""):(j===k?" sel":"")}" aria-pressed="${j===k}" ${d?"disabled":""} onclick="pk(${j})"><b>${L[j]})</b> ${t}${d&&j==q[3]?" ✅":""}${d&&j==k&&j!=q[3]?" ❌":""}</button>`).join("")+(d?`<div class="fb ${k==q[3]?"okc":"noc"}" role="status"><b>${k==q[3]?"✅ Resposta correta!":"❌ Resposta incorreta"}</b><p>Você marcou: ${L[k]}) ${opts(i)[k]}<br>Correta: ${L[q[3]]}) ${opts(i)[q[3]]}</p><p><b>${k==q[3]?"Explicação":"Por que você errou"}:</b> ${q[4]}</p>${fxA(i)}<p><b>🪤 Onde está a pegadinha:</b> ${q[5]}</p>${fxT(i)}</div><button class="b" onclick="nx()">${last?"Ver resultado":"Próxima questão"}</button>`:`<button class="b" ${k==null?"disabled":""} onclick="cf()">Confirmar resposta</button>`)+`</div>`}
function pk(j){if(S.done)return;S.sel=j;drawTr();document.querySelectorAll(".o")[j].focus()}
function cf(){const i=S.ids[S.cur];S.a[i]=S.pm[i][S.sel];S.done=true;drawTr()}
function nx(){if(S.cur==S.ids.length-1)return endTr();S.cur++;S.sel=null;S.done=false;drawTr();scrollTo(0,0)}
function endTr(){const ids=S.ids.filter(i=>S.a[i]!=null);if(!ids.length)return home();DB.att.push({id:uid(),pm:S.pm,t:S.t0,m:"tr",lv:S.lv,d:Math.round((Date.now()-S.t0)/1000),ids,a:S.a});save();S=null;res(DB.att.length-1)}
function rev(x){RV={x,s:"",a:"",p:{}};drawRev()}
function drawRev(){const t=DB.att[RV.x],er=t.ids.filter(i=>t.a[i]!=null&&t.a[i]!=Q[i][3]),f=er.filter(i=>(!RV.s||sub(i)==RV.s)&&(!RV.a||AS[i]==RV.a)),sb=[...new Set(er.map(sub))],ab=[...new Set(er.filter(i=>!RV.s||sub(i)==RV.s).map(i=>AS[i]))];
app.innerHTML=hdr()+`<div class="card"><h2>Revisão de erros</h2><p class="m">Tentativa de ${new Date(t.t).toLocaleDateString("pt-BR")} · ${er.length} erro(s). Refaça cada questão antes de ver o gabarito.</p><div class="fm"><label>Matéria<select onchange="RV.s=this.value;RV.a='';drawRev()"><option value="">Todas</option>${sb.map(s=>`<option ${s==RV.s?"selected":""}>${s}</option>`).join("")}</select></label><label>Assunto<select onchange="RV.a=this.value;drawRev()"><option value="">Todos</option>${ab.map(s=>`<option ${s==RV.a?"selected":""}>${s}</option>`).join("")}</select></label></div><div class="row"><button class="b2" onclick="home()">← Voltar ao início</button></div></div>`+(f.length?f.map(i=>rq(i,t)).join(""):`<div class="card">Nenhuma questão com esses filtros.</div>`)}
function rq(i,t){const q=Q[i],o=opts(i),p=RV.p[i]||{},d=p.done,r=[...DB.rt].reverse().find(z=>z.q==i),ex=`<div class="fb"><p>Resposta correta: ${L[q[3]]}) ${o[q[3]]}</p><p><b>Explicação:</b> ${q[4]}</p>${fxA(i)}<p><b>🪤 Pegadinha:</b> ${q[5]}</p>${fxT(i)}</div>`;
return `<div class="card"><p class="m">${sub(i)} · ${AS[i]}${r?(r.ok?" · ✅ já acertou na revisão":" · ❌ errou na revisão"):""}</p><h4>${q[1]}</h4><p class="m">Sua resposta nesta tentativa: ${o[t.a[i]]}</p>`+o.map((x,j)=>`<button class="o${d||p.show?(j==q[3]?" ok":j==p.sel?" no":""):(j===p.sel?" sel":"")}" ${d?"disabled":""} onclick="rp(${i},${j})"><b>${L[j]})</b> ${x}</button>`).join("")+(d?`<div class="fb ${p.sel==q[3]?"okc":"noc"}" role="status"><b>${p.sel==q[3]?"✅ Acertou na nova tentativa!":"❌ Errou novamente"}</b></div>${ex}`:`<div class="row"><button class="b" ${p.sel==null?"disabled":""} onclick="rc(${i})">Confirmar resposta</button><button class="b2" onclick="rs(${i})">Ver gabarito</button></div>${p.show?ex:""}`)+`</div>`}
function rp(i,j){const p=RV.p[i]=RV.p[i]||{};if(!p.done){p.sel=j;drawRev()}}
function rc(i){const p=RV.p[i];p.done=true;DB.rt.push({q:i,ok:p.sel==Q[i][3]&&!p.show,t:Date.now()});save();drawRev()}
function rs(i){(RV.p[i]=RV.p[i]||{}).show=true;drawRev()}
document.documentElement.style.setProperty("--fs",DB.fs+"px");addEventListener("beforeunload",e=>{if(S&&S.a&&Object.keys(S.a).length){e.preventDefault();e.returnValue=""}});
DB.ses&&Date.now()>=DB.ses.end?fin(true):home();
</script></body></html>
